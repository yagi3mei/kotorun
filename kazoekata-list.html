<!-- =========================================
     File: kazoekata-list.html
     Purpose: かぞえかたゲームの種類選択画面
     Author: やぎさん
     Created: 2026-05-12
     Updated: 2026-05-22：LocalStorageにベストスコア保存機能追加

     Notes:
     - 助数詞（ほん・まい・さつ等）を選択
     - 選択内容をURLパラメータで渡す
     - 共通スタイル:
       common.css / layout.css
========================================= -->

<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>かぞえかたゲーム</title>

    <!-- 共通 -->
    <link rel="stylesheet"
          href="css/common.css">

    <link rel="stylesheet"
          href="css/layout.css">

    <!-- Google Analytics -->
    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-B80JQLPCH4">
    </script>

    <script src="js/analytics.js"></script>

</head>

<body>

    <!-- =====================================
         ヘッダー
    ====================================== -->
    <div class="header">

        <!-- ロゴ -->
        <header class="top-header">

            <a href="index.html">

                <img src="images/kotorun-logo.png"
                     alt="ことラン"
                     class="app-logo">

            </a>

        </header>

        <!-- 戻る -->
        <button id="back-btn-top" onclick="goBack()">
            <span class="back-btn-japanese">もどる</span>
            <span class="back-btn-english">Back</span>
        </button>

    </div>


    <!-- =====================================
         メニュー
    ====================================== -->
    <div class="menu">

        <h1>
            <span class="title-japanese">かぞえかたゲーム</span>
            <span class="title-english">Counters</span>
        </h1>


        <!-- 個 -->
        <button onclick="goGame('tsu')">

            <span class="menu-title-japanese">～つ</span>
            <span class="menu-title-english">General Items</span>
            <br>

            <small>
                ひとつ・ふたつ・みっつ
            </small>

        </button>

        <!-- 個 -->
        <button onclick="goGame('ko')">

            <span class="menu-title-japanese">こ（個）</span>
            <span class="menu-title-english">Small Items</span>
            <br>

            <small>
                いっこ・にこ・さんこ
            </small>

        </button>


        <!-- 本 -->
        <button onclick="goGame('hon')">

            <span class="menu-title-japanese">ほん（本）</span>
            <span class="menu-title-english">Long Items</span>
            <br>

            <small>
                いっぽん・にほん・さんぼん
            </small>

        </button>


        <!-- 枚 -->
        <button onclick="goGame('mai')">

            <span class="menu-title-japanese">まい（枚）</span>
            <span class="menu-title-english">Flat Items</span>
            <br>

            <small>
                いちまい・にまい・さんまい
            </small>

        </button>


        <!-- 人 -->
        <button onclick="goGame('nin')">

            <span class="menu-title-japanese">にん（人）</span>
            <span class="menu-title-english">People</span>
            <br>

            <small>
                ひとり・ふたり・さんにん
            </small>

        </button>


        <!-- 台 -->
        <button onclick="goGame('dai')">

            <span class="menu-title-japanese">だい（台）</span>
            <span class="menu-title-english">Machines</span>
            <br>

        </button>


        <!-- 冊 -->
        <button onclick="goGame('satsu')">

            <span class="menu-title-japanese">さつ（冊）</span>
            <span class="menu-title-english">Books</span>
            <br>

            <small>
                いっさつ・にさつ・さんさつ
            </small>

        </button>


        <!-- ランダム -->
        <button onclick="goRandomGame()">

            <span class="menu-title-japanese">ランダム</span>
            <span class="menu-title-english">Random</span>
            <br>

            <small>
                いろいろな かぞえかた
            </small>

        </button>


        <!-- 学習者向け説明 -->
        <small>
            <span class="menu-description-japanese">
                かずの よみかたを<br>
                みて、きいて、おぼえよう！
            </span>
            <br>
            <span class="menu-description-english">
                Look, listen, and learn how to count!
            </span>
        </small>

    </div>


    <!-- =====================================
         スクリプト
    ====================================== -->
    <script type="module">

        import {
            getCategoryScores
        }
        from "./js/storage.js";

        /* =========================
           ゲーム開始
        ========================= */

        window.goGame = function(type) {

            location.href =
                `kazoekata-game.html?type=${type}`;

        }


        /* =========================
            ランダムゲーム
        ========================= */

        window.goRandomGame = function() {

            location.href =
                "kazoekata-random.html";

        }

        
        /* =========================
           戻る
        ========================= */

        window.goBack = function() {

            location.href =
                "kazu-jikan-index.html";

        }

        /* =========================
        実施済み表示
        ========================= */

        const scores =
            getCategoryScores(
                "kazoekata"
            );


        document
            .querySelectorAll(".menu button")
            .forEach(button => {

                const onclickText =
                    button.getAttribute(
                        "onclick"
                    );

                if (!onclickText) {
                    return;
                }

                const match =
                    onclickText.match(
                        /goGame\('(.+?)'\)/
                    );

                if (!match) {
                    return;
                }

                const type =
                    match[1];

                if (scores[type]) {

                    button.classList.add(
                        "completed"
                    );

                }

            });

    </script>

</body>
</html>
