<!-- =========================================
     File: tokei-index.html
     Purpose: とけいゲーム メニュー画面
     Author: やぎさん
     Created: 2026-05-26

     Notes:
     - 初級・中級の選択
     - beginner / intermediate を渡す
========================================= -->

<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <!-- スマホ表示対応 -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>とけいゲーム</title>

    <!-- 共通 -->
    <link rel="stylesheet"
        href="css/common.css">

    <link rel="stylesheet"
        href="css/layout.css">

    <!-- Google Analytics -->
    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-B80JQLPCH4">
    </script>

    <script src="js/analytics.js"></script>

</head>

<body>

    <div class="header">

        <!-- ロゴ -->
        <header class="top-header">

            <a href="index.html">

                <img src="images/kotorun-logo.png"
                    alt="ことラン"
                    class="app-logo">

            </a>

        </header>

        <!-- もどる -->
        <button id="back-btn-top" onclick="goBack()">
            <span class="back-btn-japanese">もどる</span>
            <span class="back-btn-english">Back</span>
        </button>

    </div>

    <!-- メニュー -->
    <div class="menu">

        <h1>
            <span class="title-japanese">とけいゲーム</span>
            <span class="title-english">Clock Game</span>
        </h1>

        <!-- 初級 -->
        <button
            data-key="tokei_beginner"
            onclick="goGame('beginner')">

            <span class="menu-title-japanese">しょきゅう（初級）</span>
            <br>
            <span class="menu-title-english">Beginner</span>
            <br>

            <small>
                なんじ？
            </small>

        </button>

        <!-- 中級 -->
        <button
            data-key="tokei_intermediate"
            onclick="goGame('intermediate')">

            <span class="menu-title-japanese">中級（ちゅうきゅう）</span>
            <br>
            <span class="menu-title-english">Intermediate</span>
            <br>

            <small>
                何時 何分？
            </small>

        </button>

    </div>

    <script>

    /* =========================
    ゲーム開始
    ========================= */
    function goGame(level) {

        location.href =

            "tokei-game.html?level="
            + level;
    }

    /* =========================
    もどる
    ========================= */
    function goBack() {

        location.href = "kazu-jikan-index.html";
    }

    /* =========================
    実施済みチェック
    ========================= */
    const scores =
    JSON.parse(
        localStorage.getItem(
            "kotorun-score"
        )
    ) || {};

    const tokeiScores =
    scores.tokei || {};

    /* 初級 */
    if (tokeiScores.beginner) {
    document
        .querySelector(
            '[data-key="tokei_beginner"]'
        )
        .classList.add(
            "completed"
        );
    }

    /* 中級 */
    if (tokeiScores.intermediate) {
    document
        .querySelector(
            '[data-key="tokei_intermediate"]'
        )
        .classList.add(
            "completed"
        );
    }

    </script>

</body>

</html>
