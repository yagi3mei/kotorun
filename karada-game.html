<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>からだゲーム</title>

    <!-- 共通 -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout.css">
    <!-- ゲーム系 -->
    <link rel="stylesheet" href="css/game.css">
    <!-- からだゲーム専用 -->
    <link rel="stylesheet" href="css/karada.css">

    <!-- Google Analytics -->
    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-B80JQLPCH4">
    </script>

    <script src="js/analytics.js"></script>

</head>
<body>
    <div class="header">

        <!-- ロゴ -->
        <header class="top-header">
            <a href="index.html">
                <img
                    src="images/kotorun-logo.png"
                    alt="ことラン"
                    class="app-logo">
            </a>
        </header>

        <!-- ステータス表示 -->
        <div id="timer-display">
            0.00
        </div>

        <div id="remaining-display">
            のこり：10
        </div>

        <div id="miss-display">
            ミス：0
        </div>

    </div>

    <!-- <h2 id="questionText"></h2> -->

    <div class="question-area">

        <div id="questionText"></div>

        <button id="sound-btn">
            🔊
        </button>

    </div>

    <div class="image-container">

        <img
            id="faceImage"
            src=""
            alt=""
        >

        <div id="marker"></div>

    </div>

    <!-- 選択肢表示エリア -->
    <div
        id="choicesContainer"
        class="choices-area">
    </div>

    <!-- =====================================
        戻るボタン
    ===================================== -->
    <div class="button-area">

        <button
            id="back-btn"
            onclick="goMenu()">
            <span class="back-btn-japanese">もどる</span>
            <span class="back-btn-english">Back</span>
        </button>

    </div>


    <audio
        id="sound-wrong"
        src="sounds/wrong.mp3">
    </audio>

    <script type="module"
        src="js/karada-game.js">
    </script>

</body>
</html>
