<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>からだゲーム</title>

    <link rel="stylesheet"
        href="css/common.css">

    <link rel="stylesheet"
        href="css/layout.css">

    <!-- Google Analytics -->
    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-B80JQLPCH4">
    </script>

    <script src="js/analytics.js"></script>

</head>

<body>

    <div class="header">

        <!-- ロゴ -->
        <header class="top-header">

            <a href="index.html">

                <img src="images/kotorun-logo.png"
                    alt="ことラン"
                    class="app-logo">

            </a>

        </header>

        <button id="back-btn-top" onclick="goBack()">
            <span class="back-btn-japanese">もどる</span>
            <span class="back-btn-english">Back</span>
        </button>

    </div>

    <div class="menu">

        <h1>
            <span class="title-japanese">からだゲーム</span>
            <span class="title-english">Body Game</span>
        </h1>

        <!-- 顔 -->
        <button
            data-key="karada_face"
            onclick="goGame('face')">

            <span class="menu-title-japanese">かお</span>
            <span class="menu-title-english">Face</span>
            <br>

            <small>
                <span class="menu-description-japanese">め・みみ・はな...</span>
                <br>
                <span class="menu-description-english">Eyes, Ears, Nose...</span>
            </small>

        </button>

        <!-- 上半身 -->
        <button
            data-key="karada_upper"
            onclick="goGame('upper')">

            <span class="menu-title-japanese">じょうはんしん</span>
            <span class="menu-title-english">Upper Body</span>
            <br>

            <small>
                <span class="menu-description-japanese">くび・かた・うで...</span>
                <br>
                <span class="menu-description-english">Neck, Shoulders, Arms...</span>
            </small>

        </button>

        <!-- 下半身 -->
        <button
            data-key="karada_lower"
            onclick="goGame('lower')">

            <span class="menu-title-japanese">かはんしん</span>
            <span class="menu-title-english">Lower Body</span>
            <br>

            <small>
                <span class="menu-description-japanese">あし・ひざ・おしり...</span>
                <br>
                <span class="menu-description-english">Legs, Knees, Buttocks...</span>
            </small>

        </button>

    </div>

    <script>

        function goGame(category)
        {
            location.href =
                "karada-game.html?category="
                + category;
        }

        function goBack()
        {
            location.href =
                "kotoba-index.html";
        }

        /* =========================
        実施済みチェック
        ========================= */

        const scores =
            JSON.parse(
                localStorage.getItem(
                    "kotorun-score"
                )
            ) || {};

        const karadaScores =
            scores.karada || {};

        /* 顔 */
        if (karadaScores.face)
        {
            document
                .querySelector(
                    '[data-key="karada_face"]'
                )
                .classList.add(
                    "completed"
                );
        }

        /* 上半身 */
        if (karadaScores.upper)
        {
            document
                .querySelector(
                    '[data-key="karada_upper"]'
                )
                .classList.add(
                    "completed"
                );
        }

        /* 下半身 */
        if (karadaScores.lower)
        {
            document
                .querySelector(
                    '[data-key="karada_lower"]'
                )
                .classList.add(
                    "completed"
                );
        }

    </script>

</body>

</html>
