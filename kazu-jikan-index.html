<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>かず・じかん</title>

    <!-- 共通 -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout.css">

    <!-- Google Analytics -->
    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-B80JQLPCH4">
    </script>

    <script src="js/analytics.js"></script>

</head>

<body>

    <div class="header">

        <!-- ロゴ -->
        <header class="top-header">

            <a href="index.html">

                <img src="images/kotorun-logo.png"
                     alt="ことラン"
                     class="app-logo">

            </a>

        </header>

        <button id="back-btn-top" onclick="goBack()">
            <span class="back-btn-japanese">もどる</span>
            <span class="back-btn-english">Back</span>
        </button>

    </div>

    <!-- メニュー -->
    <div class="menu">

        <h1>
            <span class="title-japanese">かず・じかん</span>
            <span class="title-english">Numbers & Time</span>
        </h1>

        <!-- 日づけゲーム -->
        <button onclick="goCalendar()">

            ひづけゲーム
            <span class="menu-title-english">Date Game</span>
            <br>

            <small>
                ついたち・きょう・らいしゅう…
            </small>

        </button>

        <!-- なんさいゲーム -->
        <button onclick="goAge()">

            なんさい？ゲーム
            <span class="menu-title-english">How Old?</span>
            <br>

            <small>
                いっさい・にさい・はたち…
            </small>

        </button>

        <!-- かぞえかたゲーム -->
        <button onclick="goKazoekata()">

            かぞえかたゲーム
            <span class="menu-title-english">Counters</span>
            <br>

            <small>
                いっぽん・にほん・さんぼん…
            </small>

        </button>

        <!-- とけいゲーム -->
        <button onclick="goTokei()">

            とけいゲーム
            <span class="menu-title-english">Clock Game</span>
            <br>

            <small>
                いちじ・にじ・さんじ…
            </small>

        </button>


        <!-- 学習者向け説明 -->
        <small>
            かず や じかん の<br>
            よみかたを れんしゅうします。<br>
            <span class="menu-description-english">Practice reading numbers and time.</span>
        </small>

    </div>

    <script>

        // ひづけゲームメニューへ遷移
        function goCalendar() {

            location.href = "hizuke-index.html";

        }

        // なんさいゲームへ遷移
        function goAge() {

            location.href = "age-game.html";

        }

        // かぞえかたゲームへ
        function goKazoekata() {

            location.href =
                "kazoekata-list.html";

        }

        // とけいゲームへ
        function goTokei() {

            location.href =
                "tokei-index.html";

        }

        // 戻る
        function goBack() {

            location.href = "index.html";

        }

    </script>

</body>
</html>
