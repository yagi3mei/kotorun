<!DOCTYPE html>

<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>動詞ゲーム</title>

    <!-- 共通 -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout.css">

    <!-- ゲーム系 -->
    <link rel="stylesheet" href="css/game.css">

    <!-- 動詞ゲーム専用 -->
    <link rel="stylesheet" href="css/doushi.css">

    <!-- Google Analytics -->
    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-B80JQLPCH4">
    </script>

    <script src="js/analytics.js"></script>

</head>

<body>

    <div class="header">

        <!-- ロゴ -->
        <header class="top-header">

            <a href="index.html">

                <img
                    src="images/kotorun-logo.png"
                    alt="ことラン"
                    class="app-logo">

            </a>

        </header>

        <!-- ステータス表示 -->
        <div id="timer-display">
            0.00
        </div>

        <div id="remaining-display">
            のこり：10
        </div>

        <div id="miss-display">
            ミス：0
        </div>

    </div>


    <!-- =====================================
        イラスト
    ===================================== -->

    <div class="image-container">

        <img
            id="verbImage"
            src=""
            alt="">

    </div>


    <!-- =====================================
        設問文
    ===================================== -->

    <div class="sentence-area">

        <span class="sentence-part1"></span>

        <span class="sentence-part2"></span>

        <button id="sentence-sound-btn">
            🔊
        </button>

        <span class="sentence-reading"></span>

        <span class="sentence-part3"></span>

    </div>


    <!-- =====================================
        問題
    ===================================== -->

    <div class="question-area">

        <div id="questionText"></div>

        <button id="sound-btn">
            🔊
        </button>

    </div>


    <!-- =====================================
        正解表示
    ===================================== -->

    <div id="answer-display" class="answer-display"></div>


    <!-- =====================================
        選択肢
    ===================================== -->

    <div
        id="choicesContainer"
        class="choices-area">
    </div>


    <!-- =====================================
        戻るボタン
    ===================================== -->

    <div class="button-area">

        <button
            id="back-btn"
            onclick="goBack()">

            もどる

        </button>

    </div>


    <!-- ミス音 -->
    <audio id="sound-wrong"
           src="sounds/wrong.mp3">
    </audio>


    <script type="module" src="js/doushi-game.js"></script>
</body>
</html>
