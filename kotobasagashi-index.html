<!-- =========================================
     File: karuta-index.html
     Purpose: ことばさがしゲームのメニュー選択画面
     Author: やぎさん
     Created: 2026-07-14

     Notes:
     - 各ゲームモード（ひらがな・カタカナ）への入口画面
     - URLパラメータ（type, group）を付与して次画面へ遷移
     - 共通スタイルは common.css / layout.css を使用
========================================= -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ことばさがし選択</title>

    <!-- 共通 -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout.css">

    <!-- Google Analytics -->
    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-B80JQLPCH4">
    </script>

    <script src="js/analytics.js"></script>

</head>

<body>

    <div class="header">

        <!-- ロゴ -->
        <header class="top-header">
            <a href="index.html">
                <img src="images/kotorun-logo.png"
                     alt="ことラン"
                     class="app-logo">
            </a>
        </header>

        <button id="back-btn-top" onclick="goBack()">
            <span class="back-btn-japanese">もどる</span>
            <span class="back-btn-english">Back</span>
        </button>

    </div>

    <!-- ゲーム選択ボタン -->
    <div class="menu">

        <h1>
            <span class="title-japanese">ことばさがし</span>
            <span class="title-english">Word Search</span>
        </h1>

        <button onclick="go('hira', 'seion')">
            <span class="menu-title-japanese">ひらがな（せいおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">あ・い・う…</span>
                <span class="menu-description-english">Hiragana-Seion</span>
            </small>
        </button>

        <button onclick="go('hira', 'dakuon')">
            <span class="menu-title-japanese">ひらがな（だくおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">が・ぎ・ぐ…</span>
                <span class="menu-description-english">Hiragana-Dakuon</span>
            </small>
        </button>

        <button onclick="go('hira', 'youon')">
            <span class="menu-title-japanese">ひらがな（ようおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">きゃ・しゅ・ちょ…</span>
                <span class="menu-description-english">Hiragana-Youon</span>
            </small>
        </button>

        <button onclick="go('kata', 'seion')">
            <span class="menu-title-japanese">カタカナ（せいおん/ようおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">ア・イ・シャ…</span>
                <span class="menu-description-english">Katakana-Seion / Youon</span>
            </small>
        </button>

        <button onclick="go('kata', 'dakuon')">
            <span class="menu-title-japanese">カタカナ（だくおん/ようおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">ガ・ギ・ジョ…</span>
                <span class="menu-description-english">Katakana-Dakuon / Youon</span>
            </small>
        </button>


        <!-- 学習者向け説明 -->
        <small>
            <span class="menu-description-japanese">
                ことばを れんしゅうします。
            </span>
            <br>
            <span class="menu-description-english">
                Practice words.
            </span>
            <br>

            <span class="menu-description-japanese">
                みんなの日本語 初級Ⅰの ことばです。
            </span>
            <br>
            <span class="menu-description-english">
                Words from Minna no Nihongo Beginner I.
            </span>
            <br>

            <span class="menu-description-japanese">
                えをみて ことばを さがします。
            </span>
            <br>
            <span class="menu-description-english">
                Look at the pictures and find the words.
            </span>
            <br>
            <br>

            <!-- 先生向け説明：英語表記なし -->
            ※先生へ...学習者に説明をお願いします。<br>
            ・イラストを見て、ことばを思い出します。<br>
            ・文字の中から、ことばをさがします。<br>
        </small>

    </div>

    <script>

        // かな・かるた一覧画面へ遷移
        function go(type, group) {
            location.href =
            `kotobasagashi-list.html?type=${type}&group=${group}`;
        }

        // 戻る
        function goBack() {
            location.href = "kotoba-index.html";
        }

    </script>

</body>
</html>
