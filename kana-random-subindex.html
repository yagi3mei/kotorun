<!-- =========================================
     File: kana-random-subindex.html
     Purpose: かなゲームランダムのメニュー画面
     Author: やぎさん
     Created: 2026-08-19

     Notes:
     - ひらがな、かたかなのランダム版ゲームを選択する画面
     - 清音・濁音・拗音・カタカナ（外来語含む）の各モードを選択可能
     - 共通スタイルは common.css / layout.css を使用
========================================= -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- スマホ表示対応のviewport設定（必須） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>かなゲームランダム</title>

    <!-- 共通 -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout.css">

    <!-- Google Analytics -->
    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-B80JQLPCH4">
    </script>

    <script src="js/analytics.js"></script>

</head>

<body>

    <div class="header">

        <!-- 共通ロゴ -->
        <header class="top-header">

            <a href="index.html">

                <img src="images/kotorun-logo.png"
                    alt="ことラン"
                    class="app-logo">

            </a>

        </header>

        <button id="back-btn-top" onclick="goBack()">
            <span class="back-btn-japanese">もどる</span>
            <span class="back-btn-english">Back</span>
        </button>

    </div>

    <!-- メニュー画面 -->
    <div class="menu">

        <h1>
            <span class="title-japanese">かな（ランダム）</span>
            <span class="title-english">Kana Game (Random)</span>
        </h1>

        <button
            data-key="hiragana_seion"
            onclick="goGame('seion')">

            <span class="menu-title-japanese">ひらがな（せいおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">あ・い・う…</span>
                <span class="menu-description-english">Hiragana-Seion</span>
            </small>

        </button>

        <button
            data-key="hiragana_dakuon"
            onclick="goGame('dakuon')">

            <span class="menu-title-japanese">ひらがな（だくおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">が・ぎ・ぐ…</span>
                <span class="menu-description-english">Hiragana-Dakuon</span>
            </small>

        </button>

        <button
            data-key="hiragana_youon"
            onclick="goGame('youon')">

            <span class="menu-title-japanese">ひらがな（ようおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">きゃ・きゅ・きょ…</span>
                <span class="menu-description-english">Hiragana-Youon</span>
            </small>

        </button>

        <button
            data-key="katakana_seion"
            onclick="goGame('katakana-seion')">

            <span class="menu-title-japanese">カタカナ（せいおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">ア・イ・ウ…</span>
                <span class="menu-description-english">Katakana-Seion</span>
            </small>

        </button>

        <button
            data-key="katakana_dakuon"
            onclick="goGame('katakana-dakuon')">

            <span class="menu-title-japanese">カタカナ（だくおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">ガ・ギ・グ…</span>
                <span class="menu-description-english">Katakana-Dakuon</span>
            </small>

        </button>

        <button
            data-key="katakana_youon"
            onclick="goGame('katakana-youon')">

            <span class="menu-title-japanese">カタカナ（ようおん）</span>
            <br>
            <small>
                <span class="menu-description-japanese">キャ・キュ・キョ…</span>
                <span class="menu-description-english">Katakana-Youon</span>
            </small>

        </button>

        <button
            data-key="katakana_extra"
            onclick="goGame('katakana-extra')">

            <span class="menu-title-japanese">カタカナ（外来語）</span>
            <br>
            <small>
                <span class="menu-description-japanese">ファ・ティ・ディ…</span>
                <span class="menu-description-english">Other</span>
            </small>

        </button>

    </div>

    <!-- スクリプト -->
    <script>

    function goGame(type) {

        location.href =
            "kana-random-game.html?type=" + type;
    }

    function goBack() {

        location.href = "kana-index.html";
    }

    /* =========================
       実施済みチェック
    ========================= */

    const scores =
        JSON.parse(
            localStorage.getItem("kotorun-score")
        ) || {};

    const kanaRandomScores =
        scores.kana || {};

    document
        .querySelectorAll(".menu button[data-key]")
        .forEach(button => {

            const key = "random_" + button.dataset.key;

            if (kanaRandomScores[key]) {

                button.classList.add("completed");
            }
        });

    </script>

</body>
</html>
