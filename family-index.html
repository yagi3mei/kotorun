     File: family-index.html
     Purpose: familyかるたゲームのモード選択画面
     Author: やぎさん

     Updated: 2026-05-07：親戚家族メニュー追加
     Updated: 2026-05-21：LocalStorageにベストスコア保存機能追加

     Notes:
     - 家族表現（内・外・親戚）を選択する画面
     - 「おじ・おば・いとこ」などの親戚表現に対応
     - 共通スタイルは common.css / layout.css を使用
     - ゲーム画面は family-game.html に遷移して実行
========================================= -->

<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>かぞく かるた</title>

    <!-- 共通 -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout.css">

    <!-- Google Analytics -->
    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-B80JQLPCH4">
    </script>

    <script src="js/analytics.js"></script>

</head>

<body>

    <div class="header">

        <!-- ロゴ -->
        <header class="top-header">

            <a href="index.html">

                <img src="images/kotorun-logo.png"
                     class="app-logo"
                     alt="ことラン">

            </a>

        </header>

        <button id="back-btn-top"
                onclick="goBack()">
            <span class="back-btn-japanese">もどる</span>
            <span class="back-btn-english">Back</span>
        </button>

    </div>

    <!-- メニュー -->
    <div class="menu">

        <h1>
            <span class="title-japanese">かぞくを えらんでね</span>
            <span class="title-english">Choose a Family</span>
        </h1>

        <!-- 自分の家族 -->
        <button
            data-key="inner"
            onclick="goFamily('inner')">

            <span class="menu-title-japanese">うちの（わたしの）かぞく</span>
            <br>
            <span class="menu-title-english">My Family</span>
            <br>

            <small>
                ちち・はは…
            </small>

        </button>

        <!-- 他人の家族 -->
        <button
            data-key="outer"
            onclick="goFamily('outer')">

            <span class="menu-title-japanese">ともだちの かぞく</span>
            <br>
            <span class="menu-title-english">Friend's Family</span>
            <br>

            <small>
                おとうさん・おかあさん…
            </small>

        </button>

        <!-- 親戚 -->
        <button
            data-key="relative"
            onclick="goFamily('relative')">

            <span class="menu-title-japanese">しんせきの かぞく</span>
            <br>
            <span class="menu-title-english">Relatives</span>
            <br>

            <small>
                <span class="menu-description-japanese">おじさん・いとこ…</span>
                <br>
                <span class="menu-description-english">Uncle, Cousin...</span>
                <br>

                <span class="menu-description-japanese">・おじいさん と おじさん がわかる</span>
                <br>
                <span class="menu-description-english">Tell the difference: Grandfather and Uncle.</span>
                <br>

                <span class="menu-description-japanese">・おばあさん と おばさん がわかる</span>
                <br>
                <span class="menu-description-english">Tell the difference: Grandmother and Aunt.</span>
            </small>

        </button>


    </div>

    <script>

        // mode:
        // inner   = 自分の家族
        // outer   = 他人の家族
        // relative = 親戚

        function goFamily(mode) {

            location.href =
                `family-game.html?mode=${mode}`;

        }

        // 戻る
        function goBack() {

            location.href = "kotoba-index.html";

        }

        /* =========================
        実施済みチェック
        ========================= */

        const scores =
            JSON.parse(
                localStorage.getItem("kotorun-score")
            ) || {};

        const familyScores =
            scores.family || {};

        document
            .querySelectorAll(".menu button[data-key]")
            .forEach(button => {

                const key = button.dataset.key;

                if (familyScores[key]) {

                    button.classList.add("completed");
                }
            });

    </script>

</body>
</html>
