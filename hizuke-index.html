     File: hizuke-list.html
     Purpose: ひづけゲームの種類選択画面
     Author: やぎさん
     Created: 2026-06-13

     Notes:
     - カレンダーゲーム
     - 相対時間ゲーム
========================================= -->

<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ひづけゲーム</title>

    <link rel="stylesheet"
        href="css/common.css">

    <link rel="stylesheet"
        href="css/layout.css">

    <!-- Google Analytics -->
    <script async
        src="https://www.googletagmanager.com/gtag/js?id=G-B80JQLPCH4">
    </script>

    <script src="js/analytics.js"></script>

</head>

<body>

    <div class="header">

        <header class="top-header">

            <a href="index.html">

                <img src="images/kotorun-logo.png"
                    alt="ことラン"
                    class="app-logo">

            </a>

        </header>

        <button id="back-btn-top"
                onclick="goBack()">
            <span class="back-btn-japanese">もどる</span>
            <span class="back-btn-english">Back</span>
        </button>

    </div>

    <div class="menu">

        <h1>
            <span class="title-japanese">ひづけゲーム</span>
            <span class="title-english">Date Game</span>
        </h1>

        <!-- カレンダー -->
        <button
            data-key="calendar"
            onclick="goCalendar()">

            カレンダーゲーム
            <span class="menu-title-english">Calendar Game</span>
            <br>

            <small>
                ついたち・ふつか・みっか
            </small>

        </button>

        <!-- 日付 -->
        <button
            data-key="hizuke_day"
            onclick="goRelativeTime('day')">

            きょう・あしたゲーム<br>
            <span class="menu-title-english">Today & Tomorrow</span>

        </button>

        <!-- 週 -->
        <button
            data-key="hizuke_week"
            onclick="goRelativeTime('week')">

            こんしゅう・せんしゅうゲーム<br>
            <span class="menu-title-english">This Week & Last Week</span>

        </button>

        <!-- 月 -->
        <button
            data-key="hizuke_month"
            onclick="goRelativeTime('month')">

            こんげつ・さらいげつゲーム<br>
            <span class="menu-title-english">This Month & Next Month</span>

        </button>

        <!-- 年 -->
        <button
            data-key="hizuke_year"
            onclick="goRelativeTime('year')">

            ことし・おととしゲーム<br>
            <span class="menu-title-english">This Year & The Year Before Last</span>

        </button>

        <!-- ランダム -->
        <button
            data-key="hizuke_random"
            onclick="goRelativeTime('random')">

            ランダムゲーム<br>
            <span class="menu-title-english">Random Game</span>

        </button>

        <small>
            ひづけの ことばを<br>
            れんしゅうします。<br>
            <span class="menu-description-english">Practice Date Words.</span>
        </small>

    </div>

    <script>

        function goCalendar() {

            location.href =
                "calendar-game.html";

        }

        function goRelativeTime(mode) {

            location.href =
                `relative-time-game.html?mode=${mode}`;

        }

        function goBack() {

            location.href =
                "kazu-jikan-index.html";

        }

        /* =========================
            実施済みチェック
        ========================= */

        const scores =
            JSON.parse(
                localStorage.getItem(
                    "kotorun-score"
                )
            ) || {};


        /* -------------------------
            カレンダー
        ------------------------- */

        const calendarScores =
            scores.calendar || {};

        if (calendarScores.calendar)
        {
            document
                .querySelector(
                    '[data-key="calendar"]'
                )
                .classList.add(
                    "completed"
                );
        }


        /* -------------------------
            ひづけゲーム
        ------------------------- */

        const hizukeScores =
            scores.hizuke || {};


        /* day */

        if (hizukeScores.day)
        {
            document
                .querySelector(
                    '[data-key="hizuke_day"]'
                )
                .classList.add(
                    "completed"
                );
        }


        /* week */

        if (hizukeScores.week)
        {
            document
                .querySelector(
                    '[data-key="hizuke_week"]'
                )
                .classList.add(
                    "completed"
                );
        }

        /* month */
        if (hizukeScores.month)
        {
            document
                .querySelector(
                    '[data-key="hizuke_month"]'
                )
                .classList.add(
                    "completed"
                );
        }

        /* year */
        if (hizukeScores.year)
        {
            document
                .querySelector(
                    '[data-key="hizuke_year"]'
                )
                .classList.add(
                    "completed"
                );
        }

        /* random */
        if (hizukeScores.random)
        {
            document
                .querySelector(
                    '[data-key="hizuke_random"]'
                )
                .classList.add(
                    "completed"
                );
        }

    </script>

</body>

</html>
